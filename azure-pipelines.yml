# Azure DevOps pipeline: build + test -> Docker image -> push to Docker Hub -> bump tag in Git (GitOps)
trigger:
  branches:
    include:
      - main
  paths:
    exclude:       # ignore manifest/doc-only changes so the bot commit does not loop
      - k8s
      - argocd
      - screenshots
      - README.md

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  dockerHubUser: pavandevops123456          # Docker Hub username (not a secret)
  dockerServiceConnection: dockerhub-conn     # Azure DevOps service connection name
  imageName: devops-demo
  githubRepo: pk2378-beep/devops-assessment
  # GITHUB_PAT is defined as a SECRET pipeline variable in the Azure DevOps UI, not here.

stages:
  - stage: BuildAndDeploy
    displayName: Build, test, push, update manifest
    jobs:
      - job: Pipeline
        steps:
          - checkout: self
            displayName: Checkout source

          - task: Maven@3
            displayName: Build and unit test
            inputs:
              mavenPomFile: pom.xml
              goals: clean verify
              options: -B
              javaHomeOption: JDKVersion
              jdkVersionOption: '1.17'
              publishJUnitResults: true
              testResultsFiles: '**/surefire-reports/TEST-*.xml'

          - task: Docker@2
            displayName: Build and push image to Docker Hub
            inputs:
              command: buildAndPush
              containerRegistry: $(dockerServiceConnection)
              repository: $(dockerHubUser)/$(imageName)
              Dockerfile: Dockerfile
              buildContext: .
              tags: |
                $(Build.BuildId)
                latest

          - script: |
              set -e
              NEW_IMAGE="$(dockerHubUser)/$(imageName):$(Build.BuildId)"
              sed -i "s|image: .*$(imageName):.*|image: ${NEW_IMAGE}|" k8s/deployment.yaml
              git config user.name "azure-pipelines"
              git config user.email "azure-pipelines@users.noreply.github.com"
              git add k8s/deployment.yaml
              git commit -m "ci: deploy ${NEW_IMAGE} [skip ci]" || { echo "No manifest change"; exit 0; }
              git push "https://x-access-token:${GH_PAT}@github.com/$(githubRepo).git" HEAD:main
            displayName: Update image tag in k8s manifest (GitOps)
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
            env:
              GH_PAT: $(GITHUB_PAT)
